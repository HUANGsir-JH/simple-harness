# harness 配置文件
# 复制到项目根目录为 config.local.yaml（不入 git，见 .gitignore）
# 或复制到 ~/.harness/config.yaml 作为全局配置。
# 运行: harness run "你好"
#
# 结构：default_provider 指定默认供应商，providers 按名称分组。
# 每个 provider 含 base_url / api_key(或 env_key) / models。
# 2026-08-07：仅支持 anthropic wire（ADR-022）——多 provider = 多 anthropic
# 兼容端点（Anthropic 官方、DeepSeek anthropic 兼容等），只需 base_url 覆盖。
# 每个模型可配：
#   context_window  token 数（不配则默认 128000）
#   thinking        推理模式：
#     enabled: true   # 是否启用，默认 true（不配即启用）
#     efforts: [low, high, max]  # 模型支持的档位集（默认三档）
#
# 运行时覆盖（CLI 优先于模型配置）：
#   harness run --effort max "..."       # 选档位（须在模型 efforts 内）
#   harness run --no-thinking "..."      # 关闭 thinking
#   harness run --thinking "..."         # 强制开启 thinking
#
# API key 两种提供方式:
#   1. 直接写在本文件的 api_key 字段（本地配置推荐，如 .env 转换）
#   2. env_key 指定环境变量名，运行时从环境读取（默认 ANTHROPIC_API_KEY）
#
# 模型选择: harness run --model <名> 指定；不指定用 default_provider 的 models 第一个。

# 工具审批（阶段三，ADR-029）。mode 三档：
#   readonly   — 只读工具/命令放行；写操作与 shell 命令询问用户
#   acceptedit — 只读 + 编辑工具（write_file/apply_patch）放行；shell 命令询问（默认）
#   bypass     — 全部放行（完全信任，不审批）
# 交互时按 y（允许本次）/ s（本会话记住）/ n（拒绝）；非 TTY 自动拒绝。
# 会话级可经 AgentState.Permission.Mode 覆盖（resume 恢复）。
# approval:
#   mode: acceptedit

default_provider: my-anthropic

providers:
  my-anthropic:                 # 自定义供应商名
    base_url: https://api.anthropic.com/   # 自定义端点（如 DeepSeek anthropic 兼容）；留空用官方默认
    env_key: ANTHROPIC_API_KEY  # 或 api_key: sk-xxx
    models:
      claude-sonnet-5:
        context_window: 1000000
        thinking:
          efforts: [low, high, max]
      claude-haiku-4-5:
        context_window: 1000000
        thinking:
          enabled: false        # 关闭 thinking 示例
