# harness 配置文件
# 复制到项目根目录为 config.local.yaml（不入 git，见 .gitignore）
# 或复制到 ~/.harness/config.yaml 作为全局配置。
# 运行: harness run "你好"
#
# API key 三种提供方式（按优先级）:
#   1. 直接写在本文件的 api_key 字段（本地配置推荐，如 .env 转换）
#   2. 环境变量: OPENAI_API_KEY / ANTHROPIC_API_KEY（或 env_key 指定其它变量名）
#   3. 都不配时启动报错提示

# 后端: openai (Responses API, 兼容 Ollama/LM Studio/DeepSeek 等端点) | anthropic
provider: openai

# 模型 ID
model: gpt-4o

# 可选: 自定义 API 端点 (兼容后端时使用, 留空用官方默认)
# base_url: https://api.example.com/v1

# 可选: API key（本地配置推荐）。留空则从环境变量读。
# api_key: sk-xxx

# 可选: API key 的环境变量名（留空按 provider 推断）
# env_key: OPENAI_API_KEY
